name: Refresh model figure

# Re-corre el modelo (modelo_avanzado.py) con datos frescos de BTC
# (CoinMetrics + Yahoo Finance) y actualiza figures/modelo_avanzado_latest.png.
# Los runners de GitHub tienen internet, así que la descarga y el fit corren
# en la nube. Se puede disparar a mano (workflow_dispatch) o esperar al
# schedule semanal.

on:
  schedule:
    - cron: "0 6 * * 1"   # cada lunes, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  MPLBACKEND: Agg   # matplotlib sin display en el runner

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Regenerar figura del modelo
        run: python modelo_avanzado.py

      - name: Commitear si hay cambios
        run: |
          git config user.name "Bernard Balbontín"
          git config user.email "107295900+bbalbo@users.noreply.github.com"
          git add figures/modelo_avanzado_latest.png
          if git diff --cached --quiet; then
            echo "Sin cambios en la figura."
          else
            git commit -m "data: refresh figura del modelo $(date -u +%Y-%m-%d)"
            git push
          fi
